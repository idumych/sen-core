name: appimage

# The SEN server for any x86_64 or aarch64 Linux desktop, built with Hokku on Ubuntu 24.04 so that the AppImage runs on that
# glibc or newer. One job per architecture, each native, each starting the AppImage it built on X11 (Xvfb) and on Wayland (headless
# sway) and testing the server inside it. On a v* tag it attaches each AppImage to the release, if that file isn't attached yet.
on:
  workflow_dispatch:
  push:
    branches: [hokku]
    tags: ['v*']

permissions:
  contents: write

jobs:
  appimage:
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x86_64
            runner: ubuntu-24.04
          - arch: aarch64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4

      - name: App settings
        id: app
        run: |
          . ./haiku-app.env
          echo "file=$APP_NAME-$VERSION-${{ matrix.arch }}.AppImage" >> "$GITHUB_OUTPUT"
          echo "apt=$APPIMAGE_APT_EXTRA" >> "$GITHUB_OUTPUT"
          # Cache Hokku by the commit it builds, so that a branch that moves rebuilds.
          REPO=${COSMOE_REPO:-idumych/hokku}
          TAG=${COSMOE_TAG:-hokku}
          echo "cosmoe=$(echo $REPO | tr / -)-$(git ls-remote https://github.com/$REPO.git "$TAG" | cut -c1-12)" >> "$GITHUB_OUTPUT"

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential meson ninja-build pkg-config flex bison curl file imagemagick \
            libcairo2-dev libpng-dev libjpeg-dev libwebp-dev libtiff-dev \
            zlib1g-dev libicu-dev libpango1.0-dev libicns-dev libraw-dev \
            libpixman-1-dev libfontconfig1-dev libglib2.0-dev \
            libx11-dev libx11-xcb-dev libxcursor-dev libxrandr-dev \
            libxkbcommon-dev libxkbcommon-x11-dev libwayland-dev \
            wayland-protocols libfuse3-dev desktop-file-utils \
            ${{ steps.app.outputs.apt }}

      - name: Cache Hokku build
        uses: actions/cache@v4
        with:
          path: .cosmoe/stage
          key: cosmoe-${{ steps.app.outputs.cosmoe }}-ubuntu-24.04-${{ matrix.arch }}-release

      - name: Build AppImage
        run: |
          sh packaging/appimage/build-appimage.sh
          file ${{ steps.app.outputs.file }}

      - name: Build the relation tests
        run: make -f Makefile.cosmoe -j"$(nproc)" COSMOE_ROOT=.cosmoe/stage/usr test-programs

      - name: Smoke-test tools
        run: |
          sudo DEBIAN_FRONTEND=noninteractive timeout 300 apt-get install -y --no-install-recommends \
            sway xvfb openbox xdotool

      - name: X11 smoke test (Xvfb)
        timeout-minutes: 10
        run: sh packaging/appimage/smoke.sh ${{ steps.app.outputs.file }} x11 smoke/x11 bin/relation-test

      - name: Wayland smoke test (headless sway)
        timeout-minutes: 10
        run: sh packaging/appimage/smoke.sh ${{ steps.app.outputs.file }} wayland smoke/wayland bin/relation-test

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: smoke-${{ matrix.arch }}
          path: smoke/

      - uses: actions/upload-artifact@v4
        with:
          name: AppImage-${{ matrix.arch }}
          path: ${{ steps.app.outputs.file }}

      - name: Attach to release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          F=${{ steps.app.outputs.file }}
          if gh release view "${GITHUB_REF_NAME}" --json assets --jq '.assets[].name' | grep -qx "$F"; then
            echo "Release already has $F; leaving it."
          else
            gh release upload "${GITHUB_REF_NAME}" "$F"
          fi
